name: Docker Publish to GHCR

on:
  push:
    branches:
      - "master"
    tags:
      - "v*.*.*"
  release:
    types: [published]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build & Push Container Image
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set application version from tag/release
        run: |
          TAG_NAME=""
          if [ -n "${{ github.event.release.tag_name }}" ]; then
            TAG_NAME="${{ github.event.release.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF_NAME}"
          fi
          if [ -n "$TAG_NAME" ]; then
            APP_VERSION="${TAG_NAME#v}"
            echo "Setting application version to ${APP_VERSION}"
            npm version "${APP_VERSION}" --no-git-tag-version --allow-same-version
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run in-container tests before push
        run: |
          docker build -t test-runner .
          docker run --rm test-runner npm test

      - name: Log in to the Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || github.event_name == 'release' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sync version to master branch
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
        run: |
          TAG_NAME=""
          if [ -n "${{ github.event.release.tag_name }}" ]; then
            TAG_NAME="${{ github.event.release.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF_NAME}"
          fi
          if [ -n "$TAG_NAME" ]; then
            APP_VERSION="${TAG_NAME#v}"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git reset --hard HEAD
            git clean -fd
            git checkout master || git checkout -b master origin/master
            git pull origin master
            npm version "${APP_VERSION}" --no-git-tag-version --allow-same-version
            if ! git diff --quiet package.json package-lock.json; then
              git add package.json package-lock.json
              git commit -m "chore(release): bump version to ${APP_VERSION} [skip ci]"
              git push origin master
            fi
          fi
